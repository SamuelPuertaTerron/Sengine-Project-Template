name: Notify Sengine

on:
  push:
    branches:
      - main   # change this to the branch Sengine tracks for this submodule

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger submodule update in Sengine
        env:
          GH_TOKEN: ${{ secrets.SENGINE_AUTO_UPDATE }}
        run: |
          gh api repos/SamuelPuertaTerron/Sengine/dispatches \
            -f event_type=submodule-updated
